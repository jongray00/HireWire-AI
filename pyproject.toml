[project]
name = "hirewire"
version = "0.1.0"
description = "HireWire AI agent backend"
requires-python = ">=3.11"
dependencies = [
    "cryptography==44.0.0",
    "fastapi==0.119.1",
    "python-dotenv==1.1.1",
    "python-multipart==0.0.27",
    "slowapi==0.1.9",
    "tenacity==9.0.0",
    "signalwire-agents==1.1.0",
    "structlog==25.4.0",
    "uvicorn[standard]==0.38.0",
    "sendgrid>=6.10.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "pytest-cov==6.0.0",
    "respx==0.22.0",
    "freezegun==1.5.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]
